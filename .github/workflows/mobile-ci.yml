name: Mobile CI

on:
  push:
    branches:
      - feat/mobile-react-native-aax
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

permissions:
  contents: read

jobs:
  verify-mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
          cache-dependency-path: mobile/package.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: TypeScript
        id: typecheck
        continue-on-error: true
        run: npm run typecheck 2>&1 | tee typecheck.log

      - name: React Native tests
        id: tests
        continue-on-error: true
        run: npm run test:accessibility -- --runInBand 2>&1 | tee tests.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ci-diagnostics
          path: |
            mobile/typecheck.log
            mobile/tests.log
          if-no-files-found: warn
          retention-days: 7

      - name: Enforce verification gate
        if: always()
        run: |
          if [ "${{ steps.typecheck.outcome }}" != "success" ] || [ "${{ steps.tests.outcome }}" != "success" ]; then
            echo "Mobile verification failed. Download the mobile-ci-diagnostics artifact for details."
            exit 1
          fi
